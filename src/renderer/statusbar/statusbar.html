<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <script>
    (function() {
      try {
        var t = localStorage.getItem('browser-resolved-theme');
        document.documentElement.dataset.theme = (t === 'light') ? 'light' : 'dark';
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    })();
  </script>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none';">
  <title>Status Bar</title>
  <link rel="stylesheet" href="statusbar.css">
</head>
<body>
  <div class="status-bar">
    <span class="status-url" id="url"></span>
  </div>
  <script src="../shared/theme.js"></script>
  <script src="statusbar.js"></script>
</body>
</html>
