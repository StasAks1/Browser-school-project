<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <script>
    (function() {
      try {
        var t = localStorage.getItem('browser-resolved-theme');
        document.documentElement.dataset.theme = (t === 'light') ? 'light' : 'dark';
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    })();
  </script>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; font-src 'self' data:; connect-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'none';">
  <title>Загрузки</title>
  <link rel="stylesheet" href="downloads.css">
  <link rel="stylesheet" href="../shared/tooltip.css">
</head>
<body>
  <div class="page">
    <header class="header">
      <div class="title-row">
        <h1 class="title">Загрузки</h1>
        <button id="btn-clear-all" class="btn-clear">Очистить список</button>
      </div>
      <div class="search-wrapper">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/>
          <path d="m21 21-4.35-4.35"/>
        </svg>
        <input type="text" id="search-input" class="search-input" placeholder="Поиск по загрузкам..." autocomplete="off">
      </div>
    </header>
    <main class="content" id="content"></main>
  </div>
  <script src="../shared/theme.js"></script>
  <script src="../shared/tooltip.js"></script>
  <script src="downloads.js"></script>
</body>
</html>
