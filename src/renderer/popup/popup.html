<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <script>
    (function() {
      try {
        var t = localStorage.getItem('browser-resolved-theme');
        document.documentElement.dataset.theme = (t === 'light') ? 'light' : 'dark';
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    })();
  </script>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; font-src 'self' data:; connect-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'none';">
  <title>Закладка</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <div class="popup-title">Закладка</div>
    <input type="text" id="title-input" class="popup-input" placeholder="Название" autocomplete="off">
    <div class="popup-actions">
      <button type="button" id="btn-remove" class="popup-btn popup-btn-danger">Удалить</button>
      <button type="button" id="btn-save" class="popup-btn popup-btn-primary">Готово</button>
    </div>
  </div>
  <script type="module" src="../shared/theme.js"></script>
  <script type="module" src="popup.js"></script>
</body>
</html>
