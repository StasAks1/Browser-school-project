<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browser project</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <div class="page">
    <header class="top-bar">
      <div class="logo">
        <span class="logo-text">Browser Project</span>
      </div>
    </header>

    <main class="search-area">
      <p class="subtitle">Что будем искать сегодня сэр?</p>
      <form id="search-form" class="search-form">
        <div class="search-box">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.35-4.35"></path>
          </svg>
          <input
            type="text"
            id="search-input"
            class="search-input"
            placeholder="Поиск в DuckDuckGo..."
            autocomplete="off"
            autofocus
          >
          <button type="submit" class="search-btn" aria-label="Поиск">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M5 12h14M12 5l7 7-7 7"></path>
            </svg>
          </button>
        </div>
      </form>

      <div class="shortcuts">
        <a class="shortcut" href="https://github.com" target="_blank" rel="noopener">
          <div class="shortcut-icon">🐙</div>
          <span>GitHub</span>
        </a>
        <a class="shortcut" href="https://chat.deepseek.com" target="_blank" rel="noopener">
          <div class="shortcut-icon">▶️</div>
          <span>DeepSeek</span>
        </a>
        <a class="shortcut" href="https://stackoverflow.com" target="_blank" rel="noopener">
          <div class="shortcut-icon">📚</div>
          <span>Stack Overflow</span>
        </a>
        <a class="shortcut" href="https://electronjs.org" target="_blank" rel="noopener">
          <div class="shortcut-icon">⚛️</div>
          <span>Electron</span>
        </a>
      </div>
    </main>

    <footer class="footer">
      <span>Browser Project · учебный проект 10 класса</span>
    </footer>
  </div>

  <script src="index.js"></script>
</body>
</html>
