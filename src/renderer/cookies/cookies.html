<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <script>
    (function() {
      try {
        var t = localStorage.getItem('browser-resolved-theme');
        document.documentElement.dataset.theme = (t === 'light') ? 'light' : 'dark';
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    })();
  </script>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; font-src 'self' data:; connect-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'none';">
  <title>Cookie</title>
  <link rel="stylesheet" href="cookies.css">
  <link rel="stylesheet" href="../shared/tooltip.css">
</head>
<body>
  <div class="page">
    <header class="header">
      <div class="title-row">
        <h1 class="title">Cookie</h1>
        <div class="header-actions">
          <button id="btn-add" class="btn-add">+ Добавить cookie</button>
          <button id="btn-clear-sites" class="btn-clear">Очистить данные сайтов</button>
          <button id="btn-clear-all" class="btn-clear">Удалить все cookie</button>
        </div>
      </div>
      <div class="search-wrapper">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/>
          <path d="m21 21-4.35-4.35"/>
        </svg>
        <input type="text" id="search-input" class="search-input" placeholder="Поиск по домену или имени..." autocomplete="off">
      </div>
    </header>

    <div class="notice">
      <svg class="notice-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
      <div class="notice-text">
        Все cookie хранятся <strong>только на вашем устройстве</strong> во встроенной сессии Chromium.
        Браузер не сохраняет их в свои файлы, не логирует содержимое и никуда не отправляет.
        Вы можете добавить, изменить или удалить любые cookie — это ваше локальное право.
      </div>
    </div>

    <div class="stats" id="stats"></div>

    <main class="content" id="content"></main>
  </div>

  <div id="confirm-modal" class="modal-overlay">
    <div class="modal">
      <h2 class="modal-title" id="confirm-title">Подтвердите действие</h2>
      <p class="modal-text" id="confirm-text"></p>
      <div class="modal-actions">
        <button type="button" id="confirm-cancel" class="btn btn-secondary">Отмена</button>
        <button type="button" id="confirm-ok" class="btn btn-danger">Удалить</button>
      </div>
    </div>
  </div>

  <div id="cookie-modal" class="modal-overlay">
    <div class="modal modal-wide">
      <h2 class="modal-title" id="cookie-modal-title">Новый cookie</h2>
      <form id="cookie-form" class="modal-form">
        <div class="form-row">
          <label class="form-label">
            Имя (name)
            <input type="text" id="cookie-name" class="form-input" autocomplete="off" required>
          </label>
          <label class="form-label">
            Домен
            <input type="text" id="cookie-domain" class="form-input" placeholder="example.com" autocomplete="off" required>
          </label>
        </div>

        <label class="form-label">
          Значение (value)
          <textarea id="cookie-value" class="form-input form-textarea" autocomplete="off" rows="3"></textarea>
        </label>

        <div class="form-row">
          <label class="form-label">
            Путь (path)
            <input type="text" id="cookie-path" class="form-input" value="/" autocomplete="off">
          </label>
          <label class="form-label">
            SameSite
            <select id="cookie-samesite" class="form-input">
              <option value="unspecified">Unspecified</option>
              <option value="lax">Lax</option>
              <option value="strict">Strict</option>
              <option value="no_restriction">None (no_restriction)</option>
            </select>
          </label>
        </div>

        <div class="form-row">
          <label class="form-label">
            Истекает
            <input type="datetime-local" id="cookie-expires" class="form-input">
          </label>
          <label class="form-checkbox">
            <input type="checkbox" id="cookie-session">
            <span>Сессионный (до закрытия браузера)</span>
          </label>
        </div>

        <div class="form-row">
          <label class="form-checkbox">
            <input type="checkbox" id="cookie-secure">
            <span>Secure (только HTTPS)</span>
          </label>
          <label class="form-checkbox">
            <input type="checkbox" id="cookie-httponly">
            <span>HttpOnly (недоступен из JS)</span>
          </label>
        </div>

        <div class="modal-actions">
          <button type="button" id="cookie-cancel" class="btn btn-secondary">Отмена</button>
          <button type="submit" id="cookie-submit" class="btn btn-primary">Создать</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script type="module" src="../shared/theme.js"></script>
  <script type="module" src="../shared/tooltip.js"></script>
  <script type="module" src="cookies.js"></script>
</body>
</html>
