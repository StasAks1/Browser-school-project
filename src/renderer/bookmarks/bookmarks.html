<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <script>
    (function() {
      try {
        var t = localStorage.getItem('browser-resolved-theme');
        document.documentElement.dataset.theme = (t === 'light') ? 'light' : 'dark';
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    })();
  </script>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; font-src 'self' data:; connect-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'none';">
  <title>Закладки</title>
  <link rel="stylesheet" href="bookmarks.css">
  <link rel="stylesheet" href="../shared/tooltip.css">
</head>
<body>
  <div class="page">
    <header class="header">
      <div class="header-top">
        <h1 class="title">Закладки</h1>
        <div class="search-wrapper">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/>
            <path d="m21 21-4.35-4.35"/>
          </svg>
          <input type="text" id="search-input" class="search-input" placeholder="Поиск по названию или адресу..." autocomplete="off">
        </div>
        <div class="header-actions">
          <button type="button" id="btn-select-mode" class="header-btn" title="Режим выделения">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2"/>
              <path d="M9 12l2 2 4-4"/>
            </svg>
            <span>Выделить</span>
          </button>
          <button type="button" id="btn-import" class="header-btn" title="Импорт закладок из HTML">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <path d="M17 8l-5-5-5 5"/>
              <path d="M12 3v12"/>
            </svg>
            <span>Импорт</span>
          </button>
          <button type="button" id="btn-export" class="header-btn" title="Экспорт закладок в HTML">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <path d="M7 10l5 5 5-5"/>
              <path d="M12 15V3"/>
            </svg>
            <span>Экспорт</span>
          </button>
        </div>
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <nav class="sidebar-nav" id="sidebar-nav"></nav>
        <button class="new-folder-btn" id="btn-new-folder">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 5v14M5 12h14"/>
          </svg>
          <span>Новая папка</span>
        </button>
      </aside>

      <main class="content" id="content"></main>
    </div>

    <div class="bulk-bar" id="bulk-bar" hidden>
      <span class="bulk-count" id="bulk-count">Выбрано: 0</span>
      <div class="bulk-actions">
        <button type="button" id="bulk-select-all" class="bulk-btn">Выделить все</button>
        <button type="button" id="bulk-clear" class="bulk-btn">Снять</button>
        <button type="button" id="bulk-move" class="bulk-btn" disabled>Переместить</button>
        <button type="button" id="bulk-delete" class="bulk-btn bulk-btn-danger" disabled>Удалить</button>
        <button type="button" id="bulk-exit" class="bulk-btn bulk-btn-secondary">Отмена</button>
      </div>
    </div>
  </div>

  <div id="edit-modal" class="modal-overlay">
    <div class="modal">
      <h2 class="modal-title">Редактировать закладку</h2>
      <form id="edit-form" class="modal-form">
        <label class="modal-label">
          Название
          <input type="text" id="edit-title" class="modal-input" autocomplete="off" required>
        </label>
        <label class="modal-label">
          Адрес
          <input type="text" id="edit-url" class="modal-input" autocomplete="off" required>
        </label>
        <div class="modal-actions">
          <button type="button" id="edit-cancel" class="btn btn-secondary">Отмена</button>
          <button type="submit" class="btn btn-primary">Сохранить</button>
        </div>
      </form>
    </div>
  </div>

  <div id="folder-modal" class="modal-overlay">
    <div class="modal">
      <h2 class="modal-title" id="folder-modal-title">Новая папка</h2>
      <form id="folder-form" class="modal-form">
        <label class="modal-label">
          Название папки
          <input type="text" id="folder-name" class="modal-input" autocomplete="off" required>
        </label>
        <div class="modal-actions">
          <button type="button" id="folder-cancel" class="btn btn-secondary">Отмена</button>
          <button type="submit" id="folder-submit" class="btn btn-primary">Создать</button>
        </div>
      </form>
    </div>
  </div>

  <div id="move-modal" class="modal-overlay">
    <div class="modal">
      <h2 class="modal-title">Переместить в папку</h2>
      <div class="move-list" id="move-list"></div>
      <div class="modal-actions">
        <button type="button" id="move-cancel" class="btn btn-secondary">Отмена</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script type="module" src="../shared/theme.js"></script>
  <script type="module" src="../shared/tooltip.js"></script>
  <script type="module" src="bookmarks.js"></script>
</body>
</html>
