<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <clipPath id="squircle">
    <rect x="32" y="32" width="448" height="448" rx="96" ry="96"/>
  </clipPath>

  <g clip-path="url(#squircle)">
    <!-- Фон -->
    <rect x="32" y="32" width="448" height="448" fill="#1a1a1a"/>

    <!-- Листья — узкие, направленные вверх, без растопыренных сегментов -->
    <g fill="#22c55e">
      <!-- Центральный лист — вертикальный, узкий -->
      <path d="M 256 200 C 244 165 244 120 256 82 C 268 120 268 165 256 200 Z"/>

      <!-- Левый лист — наклонён, узкий, растёт вверх-влево -->
      <path d="M 254 200 C 232 180 200 148 188 110 C 214 122 244 160 254 200 Z"/>

      <!-- Правый лист — симметрично, но чуть другой формы -->
      <path d="M 258 200 C 280 182 312 150 326 112 C 300 124 268 162 258 200 Z"/>
    </g>

    <!-- Ягода: сетка костянок с тонкой чёрной обводкой -->
    <g fill="#de5833" stroke="#000000" stroke-width="4">
      <!-- Верхний ряд -->
      <circle cx="205" cy="240" r="38"/>
      <circle cx="256" cy="228" r="40"/>
      <circle cx="307" cy="240" r="38"/>

      <!-- Второй ряд -->
      <circle cx="170" cy="298" r="42"/>
      <circle cx="228" cy="288" r="44"/>
      <circle cx="284" cy="288" r="44"/>
      <circle cx="342" cy="298" r="42"/>

      <!-- Третий ряд -->
      <circle cx="205" cy="358" r="42"/>
      <circle cx="256" cy="372" r="44"/>
      <circle cx="307" cy="358" r="42"/>

      <!-- Нижний ряд -->
      <circle cx="234" cy="418" r="34"/>
      <circle cx="278" cy="418" r="34"/>
    </g>
  </g>
</svg>